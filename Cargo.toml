[package]
name = "uhid-battery"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Publish a battery level to UPower and the desktop through a virtual HID device (/dev/uhid)"
authors = ["GregDuhamel <gregory.duhamel@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/GregDuhamel/uhid-battery"
keywords = ["uhid", "battery", "upower", "hid", "power-supply"]
categories = ["os::linux-apis", "hardware-support"]
# Consumed as a git dependency; not meant for crates.io.
publish = false

[dependencies]
rustix = { version = "1.1.5", features = ["event", "fs", "std"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dev-dependencies]
# Only to interrupt a poll() with a thread-directed signal in the unit tests
# of `serve_until`; the crate itself handles signals without it.
libc = "0.2"
# The same rustix, with pipe(2) for the hung-up wake descriptor in the unit
# tests of `serve_until` and `serve_all`.
rustix = { version = "1.1.5", features = ["pipe"] }
