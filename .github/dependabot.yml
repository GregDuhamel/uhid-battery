version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # The workflows follow each action's major tag (v7, v2…) so patch releases
  # arrive on their own; this only catches a new major.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
