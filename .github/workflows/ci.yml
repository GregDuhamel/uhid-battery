name: CI

# rustfmt, clippy, the unit tests (over a fake /dev/uhid: no hardware, no
# privileges) and the doctests on stable and on the MSRV, rustdoc and cargo
# audit, all with warnings denied: the shared Rust CI of rust-ci.yml, called
# by path so that a pull request that changes it is tested with its own
# version. The acceptance tests against the real kernel are the Live
# workflow's.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token only needs to read the repository: no job here writes anything.
permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/rust-ci.yml
    with:
      # The MSRV declared in Cargo.toml.
      msrv: "1.85"
      # The `fake` feature is linted and documented too.
      all-features: true
