name: Release

# Tags and publishes what main already says. The version is bumped in the
# pull request that makes the release (Cargo.toml, Cargo.lock, and the tag the
# README tells consumers to pin); this workflow checks that the three agree,
# refuses a version that is already tagged, runs what every pull request has
# to pass, tags main and publishes a GitHub release. There is no binary to
# attach - this is a library, consumed as a git dependency (`tag = "vX.Y.Z"`).
#
# It never commits: a commit made here would be unsigned, and main only takes
# signed commits through pull requests. That is also why there is no bump
# input any more - the bump is the pull request's job.

on:
  workflow_dispatch:

# Pushing the tag and creating the release need contents: write; nothing else.
permissions:
  contents: write

jobs:
  release:
    name: Check, tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the version main declares
        id: version
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml says $version"

      - name: Refuse a version that is already tagged
        run: |
          if git tag --list "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::v${{ steps.version.outputs.version }} is already tagged: bump the version in a pull request first"
            exit 1
          fi

      - name: Check that Cargo.lock and the README name the same version
        run: |
          lock=$(awk '/^name = "uhid-battery"$/{getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit}' Cargo.lock)
          if [ "$lock" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.lock records $lock, Cargo.toml says ${{ steps.version.outputs.version }}: run cargo update --workspace in the pull request"
            exit 1
          fi
          if grep -q 'tag = "v[0-9][0-9.]*"' README.md && ! grep -q 'tag = "v${{ steps.version.outputs.version }}"' README.md; then
            echo "::error::the README pins another tag than v${{ steps.version.outputs.version }}: update it in the pull request"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A tag is a promise to the daemons that pin it: do not make one that
      # does not pass what every pull request has to.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo test --doc
        run: cargo test --locked --doc

      - name: Tag main
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
