name: Live

# The acceptance tests against the real kernel (tests/live.rs): create a
# virtual battery of each kind through /dev/uhid and read it back from sysfs
# the way UPower does. They need root, which the hosted Ubuntu runner grants
# through passwordless sudo, and a kernel with uhid and HID battery support
# (CONFIG_HID_BATTERY_STRENGTH). Ubuntu's generic kernel has both; the Azure
# kernel GitHub's hosted runners boot has uhid as an extra module and no HID
# battery support at all.
#
# The test binary is built as the runner's user and run under sudo so that
# root needs no cargo, no toolchain and no target directory of its own. The
# tests only run where the kernel can expose a HID battery (see the kernel
# check below); elsewhere - on GitHub's hosted runners today - the job builds
# them, warns, and passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  live:
    name: Live (/dev/uhid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Load the uhid module
        # The Azure kernel ships uhid in linux-modules-extra, not in the base
        # modules package. Not fatal: without the node the tests say so and
        # return, which the summary line below makes visible.
        run: |
          if ! sudo modprobe uhid 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
            sudo modprobe uhid || true
          fi
          ls -l /dev/uhid || echo "::warning::no /dev/uhid on this runner: the live tests will skip"

      - name: Check that this kernel exposes HID batteries
        id: kernel
        # The power supply behind a HID battery comes from CONFIG_HID_BATTERY_STRENGTH,
        # a build-time option, not a module: Ubuntu's generic kernel has it, the
        # Azure kernel of the hosted runners does not. Without it uhid creates the
        # device but no power supply ever appears, and the tests would fail for a
        # reason that is not ours. So they only run where the kernel can pass them,
        # and the skip is loud.
        run: |
          cfg="/boot/config-$(uname -r)"
          if [ -e /dev/uhid ] && grep -q '^CONFIG_HID_BATTERY_STRENGTH=y' "$cfg" 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::kernel $(uname -r) cannot expose HID batteries (CONFIG_HID_BATTERY_STRENGTH or /dev/uhid missing): live tests skipped, only built"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the live test binary
        id: build
        run: |
          bin=$(cargo test --test live --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "live" and .executable != null) | .executable')
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run the live tests as root
        if: steps.kernel.outputs.ok == 'true'
        env:
          LIVE_TEST_BIN: ${{ steps.build.outputs.bin }}
        run: sudo -E "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1

      - name: Kernel log, for when the tests fail
        if: failure() && steps.kernel.outputs.ok == 'true'
        run: sudo dmesg | tail -50 || true
